<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https: http://localhost:*; img-src 'self' data: blob:; frame-src blob:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f3f6f9">
<title>Lab Link</title>
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
</head>
<body>

<section id="auth" class="auth hidden">
  <button class="icon-btn theme-fab theme-toggle" type="button" title="الوضع الليلي / النهاري"></button>
  <div class="auth-card">
    <div class="brand-mark"><img id="authLogo" src="logo.svg" alt=""></div>
    <h1 id="authTitle"></h1>
    <p id="authSub" class="auth-sub"></p>

    <!-- تفعيل الجهاز (أول مرة بس) -->
    <div id="activateBox" class="hidden">
      <p class="sub">البرنامج محتاج تفعيل. ابعت رقم الجهاز ده للشركة المزودة وهيرجعولك كود التفعيل.</p>
      <div class="serial-box">
        <span>رقم الجهاز</span>
        <b id="serialText"></b>
        <button type="button" class="btn sm" id="copySerial"><i data-i="copy"></i>نسخ</button>
      </div>
      <form id="activateForm">
        <label>كود التفعيل<input name="code" dir="ltr" placeholder="XXXX-XXXX-XXXX" autocomplete="off" required></label>
        <button class="btn primary block lg" type="submit">تفعيل</button>
      </form>
    </div>

    <!-- تسجيل الدخول -->
    <form id="loginForm" class="hidden">
      <label>اسم المستخدم<input name="username" dir="ltr" autocomplete="username" required></label>
      <label>كلمة السر<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn primary block lg" type="submit">دخول</button>
    </form>

    <p id="authMsg" class="msg"></p>
    <button id="retryBtn" class="btn hidden" type="button"><i data-i="refresh"></i>إعادة المحاولة</button>
  </div>
</section>

<section id="main" class="main hidden">
  <header class="topbar">
    <div class="logo-tile"><img id="topLogo" src="logo.svg" alt=""></div>
    <div class="brand">
      <strong id="appName"></strong>
      <span id="labInfo"></span>
    </div>
    <span id="ver" class="ver"></span>
    <button id="updBtn" class="icon-btn" title="التحقق من تحديث"><i data-i="refresh"></i></button>
    <button class="icon-btn theme-toggle" type="button" title="الوضع الليلي / النهاري"></button>
    <button id="settingsBtn" class="btn"><i data-i="settings"></i>الإعدادات</button>
    <button id="logoutBtn" class="btn ghost"><i data-i="logout"></i>خروج</button>
  </header>
  <div id="pwWarn" class="warnbar hidden">
    <span>كلمة السر الحالية هي الافتراضية (1234). غيّرها من الإعدادات عشان الأمان.</span>
    <button class="btn sm" id="pwWarnBtn">تغيير الآن</button>
  </div>

  <div class="layout">
    <aside class="patients">
      <button id="newPatientBtn" class="btn primary block lg"><i data-i="plus"></i>مريض جديد</button>
      <div class="search-wrap">
        <i data-i="search"></i>
        <input id="search" class="search" placeholder="بحث بالاسم أو الكود">
      </div>
      <ul id="patientList"></ul>
      <div id="dayPanel" class="daypanel">
        <button id="dayToggle" type="button" class="dayhead" title="فتح التقويم">
          <span class="dsi"><i data-i="calendar"></i></span>
          <span class="dst"><small id="dayLbl"></small><b id="dayTitle"></b></span>
          <span class="cnt" id="dayCount"></span>
          <i data-i="chev" class="chev"></i>
        </button>
        <div id="cal" class="cal hidden"></div>
        <div id="dayChips" class="chips">
          <button type="button" data-q="today">اليوم</button>
          <button type="button" data-q="yest">أمس</button>
          <button type="button" data-q="7">٧ أيام</button>
          <button type="button" data-q="all">الكل</button>
        </div>
        <div class="range">
          <label><span>من</span><input type="date" id="dFrom"></label>
          <label><span>إلى</span><input type="date" id="dTo"></label>
        </div>
      </div>
    </aside>
    <main id="results" class="results"></main>
  </div>
</section>

<div id="updBar" class="updbar hidden"></div>
<div id="modal" class="modal hidden"><div class="modal-box"><button type="button" class="modal-x" id="modalX" title="إغلاق (Esc)" aria-label="إغلاق"></button><div class="modal-card" id="modalCard"></div></div></div>
<div id="toast" class="toast hidden"></div>
<div id="printArea"></div>
<input id="fileInput" type="file" accept="application/pdf,.pdf" multiple hidden>

<script src="app.js"></script>
</body>
</html>
