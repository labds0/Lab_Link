name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: desktop
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version

      - name: Install
        working-directory: desktop
        run: npm install

      - name: Build installer
        working-directory: desktop
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: LabLink-Setup
          path: |
            desktop/dist/*.exe
            desktop/dist/*.blockmap
            desktop/dist/latest.yml

      # عند الـ tag بس: نرفع التحديث على السيرفر، فالبرامج المثبتة تلاقيه وتتحدّث لوحدها
      # لازم secrets: CLOUDFLARE_API_TOKEN و CLOUDFLARE_ACCOUNT_ID
      - name: Publish update to Worker (R2)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for f in ../desktop/dist/*.exe ../desktop/dist/*.blockmap; do
            npx --yes wrangler r2 object put "lab-results-files/updates/$(basename "$f")" --file "$f" --remote
          done
          # latest.yml آخر حاجة، عشان ماحدش يشوف إصدار ملفه لسه ما اترفعش
          npx --yes wrangler r2 object put "lab-results-files/updates/latest.yml" --file ../desktop/dist/latest.yml --remote
